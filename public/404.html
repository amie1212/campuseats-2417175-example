<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CampusEats - Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        var base = '/campuseats-2417175-example/';
        var path = window.location.pathname;
        var relativePath = path.startsWith(base) ? path.substring(base.length) : path.replace(/^\//, '');
        var target = base + '#/' + relativePath + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CampusEats...</p>
  </body>
</html>
